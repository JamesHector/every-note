<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every Note — Bristol Gigs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 Every Note</h1>
      <p>Bristol gigs you don't want to miss</p>
    </header>

    <div class="controls">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <input
          type="text"
          id="searchBox"
          class="search-box"
          placeholder="Search by band, venue, or genre..."
          style="flex: 1; margin-right: 10px;"
        >
        <button onclick="showAttendanceModal()" class="btn btn-secondary" style="white-space: nowrap;">
          👥 Attendance
        </button>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>Genres:</label>
          <div id="genreFilters" class="genre-list"></div>
        </div>

        <div class="filter-group">
          <label>Venues:</label>
          <div id="venueFilters" class="venue-list"></div>
        </div>

        <div class="filter-group">
          <label>Date range:</label>
          <input
            type="date"
            id="startDate"
            class="date-input"
          >
          <span>to</span>
          <input
            type="date"
            id="endDate"
            class="date-input"
          >
          <button onclick="resetDates()" class="btn-reset">Reset</button>
        </div>
      </div>
    </div>

    <div id="gigsList" class="gigs-grid">
      <p>Loading gigs...</p>
    </div>
  </div>

  <!-- Name Input Modal -->
  <div id="nameModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>Welcome to Every Note!</h2>
      <p>What's your name? We'll remember it for marking gigs you're interested in.</p>
      <input type="text" id="nameInput" class="name-input" placeholder="Enter your name..." maxlength="100">
      <button onclick="saveName()" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Save</button>
    </div>
  </div>

  <!-- Attendance Summary Modal -->
  <div id="attendanceModal" class="modal" style="display: none;">
    <div class="modal-content attendance-modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Who's Going Where</h2>
        <button onclick="closeAttendanceModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">×</button>
      </div>
      <div id="attendanceTable" style="overflow-x: auto;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
